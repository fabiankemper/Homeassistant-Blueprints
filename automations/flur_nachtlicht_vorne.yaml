alias: Flur Nachtlicht vorne
description: >-
  Schalte das Flurlicht durch Bewegung an, wenn es nicht an ist. Schalte es aus,
  wenn eine Minute keine Bewegung erkannt wurde. Brich diese Sequenz ab, wenn
  das Licht von außen verändert wird (App/Dashboard/Sprache/Schalter/Taster).
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.bewegungsmelder_flur_vorne_occupancy
    from: "off"
    to: "on"
conditions:
  - condition: state
    entity_id: light.flur_lampe
    state: "off"
  - condition: state
    entity_id: sun.sun
    state: below_horizon
actions:
  - action: light.turn_on
    target:
      entity_id: light.flur_lampe
    data:
      brightness_pct: 10
      transition: 0.5
  # Warten bis keine Bewegung mehr ist oder das Licht von außen verändert wird.
  # Zustandsänderungen der Lampe, die von dieser Automation selbst stammen
  # (Rückmeldung des Geräts nach turn_on), tragen den Kontext dieses Laufs und
  # werden ignoriert.
  - repeat:
      sequence:
        - wait_for_trigger:
            # Keine Bewegung mehr seit 1 Minute
            - trigger: state
              entity_id: binary_sensor.bewegungsmelder_flur_vorne_occupancy
              to: "off"
              for:
                minutes: 1
              id: no_motion
            # Jede Änderung der Lampe (Zustand oder Attribute)
            - trigger: state
              entity_id: light.flur_lampe
              id: light_changed
          timeout:
            hours: 1
      until:
        - condition: template
          value_template: >-
            {{ wait.trigger is none
               or wait.trigger.id == 'no_motion'
               or wait.trigger.to_state is none
               or wait.trigger.to_state.context.id != context.id }}
  # Nur ausschalten, wenn nicht von außen eingegriffen wurde
  - condition: template
    value_template: "{{ wait.trigger is none or wait.trigger.id == 'no_motion' }}"
  - action: light.turn_off
    target:
      entity_id: light.flur_lampe
    data:
      transition: 0.5
mode: single
